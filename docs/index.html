<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Eric – Internal Chatbot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="chat-container">
    <h1>Eric – Internal Credit Union Assistant</h1>
    <div id="chat-log"></div>

    <div class="input-row">
      <input
        type="text"
        id="user-input"
        placeholder="Ask Eric something..."
        autocomplete="off"
      />
      <button id="send-btn">Send</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
